name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11 and sync dependencies
        run: uv sync --locked

      - name: Run Ruff lint
        run: uv run ruff check src/dynamic_concept_explorer/scraper.py tests/

      - name: Run Ruff format check
        run: uv run ruff format --check src/dynamic_concept_explorer/scraper.py tests/

      - name: Run unit tests
        run: uv run pytest -v
