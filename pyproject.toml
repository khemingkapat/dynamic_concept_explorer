[project]
name = "dynamic-concept-explorer"
version = "0.1.0"
description = "Dynamic Concept Explorer: Visualizing and Summarizing Wikipedia Topic Networks"
readme = "README.md"
authors = [
    { name = "khemingkapat", email = "60930364+khemingkapat@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "gensim>=4.4.0",
    "lexrank>=0.1.0",
    "matplotlib>=3.9.0",
    "networkx>=3.0",
    "nltk>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "scikit-learn>=1.4.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "wordcloud>=1.9.0",
]

[project.scripts]
dynamic-concept-explorer = "dynamic_concept_explorer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "jupyterlab>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
